<div class="grid md:grid-cols-2 gap-8">

  <div>
    <h1 class="text-3xl font-bold text-gray-900 max-w-md mx-auto">
      Signo zodiacal chino
    </h1>

    <br>

    <form
      [formGroup]="formulario"
      (ngSubmit)="calcular()"
      class="max-w-md mx-auto"
    >

      <div class="relative z-0 w-full mb-5 group">
        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          class="block py-2.5 px-0 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300"
          placeholder=" "
          required
        />
        <label for="nombre">Nombre</label>
      </div>

      <div class="grid md:grid-cols-2 md:gap-6">

        <div class="relative z-0 w-full mb-5 group">
          <input
            type="text"
            id="apaterno"
            formControlName="apaterno"
            class="block py-2.5 px-0 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300"
            placeholder=" "
            required
          />
          <label for="apaterno">Apellido paterno</label>
        </div>

        <div class="relative z-0 w-full mb-5 group">
          <input
            type="text"
            id="amaterno"
            formControlName="amaterno"
            class="block py-2.5 px-0 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300"
            placeholder=" "
            required
          />
          <label for="amaterno">Apellido materno</label>
        </div>

      </div>

      <h2 class="font-bold mb-3">Fecha de nacimiento</h2>

      <div class="grid grid-cols-3 gap-4">

        <div class="mb-5">
          <input
            type="number"
            id="dia"
            formControlName="dia"
            min="1"
            max="31"
            class="block py-2.5 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300"
            placeholder="Día"
            required
          />
        </div>

        <div class="mb-5">
          <input
            type="number"
            id="mes"
            formControlName="mes"
            min="1"
            max="12"
            class="block py-2.5 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300"
            placeholder="Mes"
            required
          />
        </div>

        <div class="mb-5">
          <input
            type="number"
            id="anio"
            formControlName="anio"
            min="1"
            [max]="2026"
            class="block py-2.5 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300"
            placeholder="Año"
            required
          />
        </div>

      </div>

      <button
        type="submit"
        (click)="calcular()"
        class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5"
      >
        Calcular signo
      </button>

      <p class="text-red-600 mt-4">
        {{ mensajeError }}
      </p>

    </form>
  </div>

  <div class="p-6 rounded-lg bg-gray-100">

    <h1 class="text-3xl font-bold text-gray-900">
      Hola {{ nombreCompleto || '...' }}
    </h1>

    <h2 class="font-bold text-gray-600 mt-4">
      Tienes {{ edad === null ? '--' : edad }} años
    </h2>

    <h2 class="font-bold text-gray-600 mt-4">
      Tu signo zodiacal chino es:
    </h2>

    <p class="text-2xl font-bold text-blue-700 mt-2">
      {{ signoChino || 'Pendiente de calcular' }}
    </p>

    <img
      [src]="imagenSigno"
      class="w-48 h-48 object-contain mx-auto mt-4"
    />

  </div>

</div>
